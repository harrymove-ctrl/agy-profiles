[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-profiles"
version = "0.3.0"
description = "Multi-account sandbox, 24/7 Rust watchdog (dev.agy-profiles.watchdog), 5m post-login session auto-recovery, black-screen healer, and 18-tool MCP server for Google Antigravity on macOS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = [
  "google-antigravity",
  "antigravity",
  "antigravity-cli",
  "mcp",
  "watchdog",
  "agent-recovery",
  "agent-safety",
  "multi-account",
  "sandbox",
  "macos",
  "launchd",
  "acp"
]
authors = [
  { name = "harrymove-ctrl" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/harrymove-ctrl/agy-profiles"
Repository = "https://github.com/harrymove-ctrl/agy-profiles"

[project.scripts]
agy-profiles = "agy_profiles.cli:main"
agyp = "agy_profiles.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agy_profiles = ["web_static/*", "web_static/fonts/*"]
